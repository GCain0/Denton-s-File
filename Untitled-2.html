!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reminder</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4fa;
  color: #252b40;
  padding: 30px 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px #17255412;
}

h1 {
  margin: 0 0 8px;
  color: #3548a5;
}

.subtitle {
  color: #777;
  margin-bottom: 25px;
}

.date {
  background: #edf0ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 16px;
  border: 1px solid #d8dbea;
  border-radius: 9px;
  font-size: 15px;
}

textarea {
  resize: vertical;
  min-height: 65px;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.add-btn {
  background: #4356c5;
  color: white;
  width: 100%;
}

.notify-btn {
  background: #edf0ff;
  color: #3548a5;
  width: 100%;
  margin-top: 12px;
}

button:hover {
  opacity: 0.85;
}

h2 {
  margin-top: 30px;
  font-size: 19px;
}

.reminder {
  background: #f7f8fc;
  border: 1px solid #e8eaf2;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.reminder h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.reminder p {
  margin: 4px 0;
  color: #777;
  font-size: 13px;
}

.reminder-time {
  color: #4356c5;
  font-weight: bold;
}

.delete-btn {
  background: #ffe9e9;
  color: #d33;
  padding: 9px 12px;
}

.empty {
  text-align: center;
  color: #999;
  padding: 25px 5px;
}

.status {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 18px;
}

.toast {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #29365e;
  color: white;
  padding: 15px 22px;
  border-radius: 10px;
  width: max-content;
  max-width: 90%;
  box-shadow: 0 5px 20px #0002;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔔 Daily Reminders</h1>
  <p class="subtitle">Stay organized. Never forget what matters.</p>

  <div class="date" id="today"></div>

  <h2>Create a Reminder</h2>

  <form id="reminderForm">

    <label>Reminder Title</label>
    <input
      type="text"
      id="title"
      placeholder="Example: Take a break"
      required
    >

    <label>Description</label>
    <textarea
      id="description"
      placeholder="What do you need to remember?"
    ></textarea>

    <label>Reminder Time</label>
    <input type="time" id="time" required>

    <button class="add-btn" type="submit">
      + Add Daily Reminder
    </button>

  </form>

  <button class="notify-btn" id="notificationBtn">
    Enable Desktop Notifications
  </button>

  <h2>My Daily Reminders</h2>

  <div id="reminderList"></div>

  <p class="status">
    Your reminders are saved automatically on this device.
  </p>

</div>

<div class="toast" id="toast"></div>

<script>

const form = document.getElementById("reminderForm");
const list = document.getElementById("reminderList");
const toast = document.getElementById("toast");

let reminders = JSON.parse(
  localStorage.getItem("dailyReminders") || "[]"
);

function saveReminders() {
  localStorage.setItem(
    "dailyReminders",
    JSON.stringify(reminders)
  );
}

function showToast(message) {
  toast.textContent = message;
  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  }, 4000);
}

function updateDate() {
  const now = new Date();

  document.getElementById("today").textContent =
    now.toLocaleDateString("en-US", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });
}

function renderReminders() {

  list.innerHTML = "";

  if (reminders.length === 0) {
    list.innerHTML =
      '<div class="empty">No reminders yet. Add your first one!</div>';
    return;
  }

  reminders.sort((a, b) =>
    a.time.localeCompare(b.time)
  );

  reminders.forEach((reminder) => {

    const item = document.createElement("div");
    item.className = "reminder";

    const info = document.createElement("div");

    const heading = document.createElement("h3");
    heading.textContent = reminder.title;

    const description = document.createElement("p");
    description.textContent =
      reminder.description || "Daily reminder";

    const time = document.createElement("p");
    time.className = "reminder-time";
    time.textContent = formatTime(reminder.time);

    const status = document.createElement("p");
    status.textContent = reminder.enabled
      ? "● Active"
      : "○ Paused";

    info.append(heading, description, time, status);

    const actions = document.createElement("div");

    const toggle = document.createElement("input");
    toggle.type = "checkbox";
    toggle.checked = reminder.enabled;
    toggle.title = "Enable or pause reminder";

    toggle.addEventListener("change", () => {
      reminder.enabled = toggle.checked;
      saveReminders();
      renderReminders();
    });

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.className = "delete-btn";

    remove.addEventListener("click", () => {
      reminders = reminders.filter(
        r => r.id !== reminder.id
      );

      saveReminders();
      renderReminders();
      showToast("Reminder deleted.");
    });

    actions.append(toggle, remove);
    item.append(info, actions);
    list.appendChild(item);

  });
}

function formatTime(time) {
  const [hours, minutes] = time.split(":");
  const date = new Date();
  date.setHours(Number(hours), Number(minutes));

  return date.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}

form.addEventListener("submit", (event) => {

  event.preventDefault();

  const reminder = {
    id: Date.now().toString(),
    title: document.getElementById("title").value.trim(),
    description:
      document.getElementById("description").value.trim(),
    time: document.getElementById("time").value,
    enabled: true,
    lastFired: ""
  };

  reminders.push(reminder);

  saveReminders();
  renderReminders();

  form.reset();

  showToast("Daily reminder added!");

});

document.getElementById("notificationBtn")
  .addEventListener("click", async () => {

    if (!("Notification" in window)) {
      showToast("Notifications are not supported by this browser.");
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission === "granted") {
      showToast("Desktop notifications enabled!");
    } else {
      showToast("Please allow notifications in your browser settings.");
    }

  });

// Check reminders every 15 seconds.
function checkReminders() {

  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;

  const now = new Date();

  const currentTime =
    String(now.getHours()).padStart(2, "0") + ":" +
    String(now.getMinutes()).padStart(2, "0");

  const today = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");

  reminders.forEach(reminder => {

    if (
      reminder.enabled &&
      currentTime >= reminder.time &&
      reminder.lastFired !== today
    ) {

      new Notification("🔔 " + reminder.title, {
        body: reminder.description || "Your daily reminder!",
        tag: reminder.id
      });

      reminder.lastFired = today;
      saveReminders();

    }

  });

}

updateDate();
renderReminders();
checkReminders();

setInterval(checkReminders, 15000);

</script>

</body>
</html>
