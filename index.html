<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reminders</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4fa;
  color: #252b40;
  padding: 30px 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px #17255412;
}

h1 {
  margin: 0 0 8px;
  color: #3548a5;
}

.subtitle {
  color: #777;
  margin-bottom: 25px;
}

.date {
  background: #edf0ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  font-weight: bold;
}

label {
  font-weight: bold;
  font-size: 14px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 16px;
  border: 1px solid #d8dbea;
  border-radius: 9px;
  font-size: 15px;
}

textarea {
  resize: vertical;
  min-height: 65px;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

button:hover {
  opacity: 0.85;
}

.add-btn {
  background: #4356c5;
  color: white;
  width: 100%;
}

.notify-btn {
  background: #edf0ff;
  color: #3548a5;
  width: 100%;
  margin-top: 12px;
}

h2 {
  margin-top: 30px;
  font-size: 19px;
}

.reminder {
  background: #f7f8fc;
  border: 1px solid #e8eaf2;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.reminder h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.reminder p {
  margin: 4px 0;
  color: #777;
  font-size: 13px;
}

.reminder-time {
  color: #4356c5 !important;
  font-weight: bold;
  font-size: 15px !important;
}

.actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.toggle {
  width: 20px;
  height: 20px;
  margin: 0;
  cursor: pointer;
}

.delete-btn {
  background: #ffe9e9;
  color: #d33;
  padding: 9px 12px;
}

.empty {
  text-align: center;
  color: #999;
  padding: 25px 5px;
}

.status {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 18px;
}

.toast {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #29365e;
  color: white;
  padding: 15px 22px;
  border-radius: 10px;
  width: max-content;
  max-width: 90%;
  box-shadow: 0 5px 20px #0002;
}

/* Full-screen reminder alarm */

.alarm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 20, 40, 0.88);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.alarm-box {
  background: white;
  width: 100%;
  max-width: 480px;
  text-align: center;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 20px 80px #0008;
  animation: alarmPulse 1s infinite alternate;
}

.alarm-icon {
  font-size: 60px;
  margin-bottom: 10px;
}

.alarm-box h2 {
  color: #d93636;
  margin: 10px 0;
  font-size: 28px;
}

.alarm-box h3 {
  font-size: 22px;
  color: #252b40;
  margin: 15px 0 8px;
}

.alarm-box p {
  color: #666;
  font-size: 16px;
}

.dismiss-btn {
  background: #4356c5;
  color: white;
  width: 100%;
  margin-top: 20px;
  font-size: 16px;
}

@keyframes alarmPulse {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.03);
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🔔 Daily Reminders</h1>
  <p class="subtitle">
    Stay organized. Never forget what matters.
  </p>

  <div class="date" id="today"></div>

  <h2>Create a Reminder</h2>

  <form id="reminderForm">

    <label for="title">Reminder Title</label>

    <input
      type="text"
      id="title"
      placeholder="Example: Check Teams Rooms"
      required
    >

    <label for="description">Description</label>

    <textarea
      id="description"
      placeholder="What do you need to remember?"
    ></textarea>

    <label for="time">Reminder Time</label>

    <input
      type="time"
      id="time"
      required
    >

    <button
      class="add-btn"
      type="submit"
    >
      + Add Daily
