<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Daily Reminder</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4fa;
  color: #252b40;
  padding: 30px 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px #17255412;
}

h1 {
  margin: 0 0 8px;
  color: #3548a5;
}

.subtitle {
  color: #777;
  margin-bottom: 25px;
}

.date {
  background: #edf0ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  font-weight: bold;
}

label {
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 16px;
  border: 1px solid #d8dbea;
  border-radius: 9px;
  font-size: 15px;
}

textarea {
  resize: vertical;
  min-height: 65px;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

button:hover {
  opacity: 0.85;
}

.add-btn {
  background: #4356c5;
  color: white;
  width: 100%;
}

h2 {
  margin-top: 30px;
  font-size: 19px;
}

.reminder {
  background: #f7f8fc;
  border: 1px solid #e8eaf2;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.reminder-info {
  flex: 1;
}

.reminder h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.reminder p {
  margin: 4px 0;
  color: #777;
  font-size: 13px;
}

.reminder-time {
  color: #4356c5 !important;
  font-weight: bold;
}

.reminder-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.reminder-actions input {
  width: auto;
  margin: 0;
}

.delete-btn {
  background: #ffe9e9;
  color: #d33;
  padding: 9px 12px;
}

.empty {
  text-align: center;
  color: #999;
  padding: 25px 5px;
