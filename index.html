<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Reminder</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4fa;
  color: #252b40;
  padding: 30px 15px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px #17255412;
}

h1 {
  margin: 0 0 8px;
  color: #3548a5;
}

.subtitle {
  color: #777;
  margin-bottom: 25px;
}

.date {
  background: #edf0ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-weight: bold;
}

/* iPhone audio status */
.audio-status {
  background: #fff4d6;
  border: 1px solid #f1d277;
  color: #6b5500;
  padding: 13px;
  border-radius: 10px;
  margin-bottom: 22px;
  text-align: center;
  font-size: 13px;
}

.audio-status.ready {
  background: #e8f8ed;
  border-color: #9ed7ad;
  color: #23733a;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 16px;
  border: 1px solid #d8dbea;
  border-radius: 9px;
  font-size: 16px;
}

textarea {
  resize: vertical;
  min-height: 65px;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

.add-btn {
  background: #4356c5;
  color: white;
  width: 100%;
}

.test-btn {
  background: #edf0ff;
  color: #3548a5;
  width: 100%;
  margin-top: 12px;
}

button:hover {
  opacity: 0.85;
}

h2 {
  margin-top: 30px;
  font-size: 19px;
}

.reminder {
  background: #f7f8fc;
  border: 1px solid #e8eaf2;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.reminder h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

.reminder p {
  margin: 4px 0;
  color: #777;
  font-size: 13px;
}

.reminder-time {
  color: #4356c5 !important;
  font-weight: bold;
}

.reminder-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.reminder-actions input {
  width: auto;
  margin: 0;
}

.delete-btn {
  background: #ffe9e9;
  color: #d33;
  padding: 9px 12px;
}

.empty {
  text-align: center;
  color: #999;
  padding: 25px 5px;
}

.status {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 18px;
}

.toast {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);

  background: #29365e;
  color: white;

  padding: 15px 22px;
  border-radius: 10px;

  width: max-content;
  max-width: 90%;

  box-shadow: 0 5px 20px #0002;

  z-index: 9999;
}
</style>
</head>

<body>

<div class="container">

  <h1>🔔 Daily Reminders</h1>

  <p class="subtitle">
    Stay organized. Never forget what matters.
  </p>

  <div class="date" id="today"></div>

  <div class="audio-status" id="audioStatus">
    🔊 Tap anywhere on this page once to enable iPhone alarm sound.
  </div>


  <h2>Create a Reminder</h2>

  <form id="reminderForm">

    <label for="title">
      Reminder Title
    </label>

    <input
      type="text"
      id="title"
      placeholder="Example: Take a break"
      required
    >


    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      placeholder="What do you need to remember?"
    ></textarea>


    <label for="time">
      Reminder Time
    </label>

    <input
      type="time"
      id="time"
      required
    >


    <button
      class="add-btn"
      type="submit"
    >
      + Add Daily Reminder
    </button>

  </form>


  <button
    class="test-btn"
    id="testSoundBtn"
    type="button"
  >
    🔊 Test Alarm Sound
  </button>


  <h2>My Daily Reminders</h2>

  <div id="reminderList"></div>


  <p class="status">
    Keep this page open for reminders to work.
  </p>

</div>


<div
  class="toast"
  id="toast"
></div>



<script>

/* =====================================
   ELEMENTS
===================================== */

const form =
  document.getElementById("reminderForm");

const list =
  document.getElementById("reminderList");

const toast =
  document.getElementById("toast");

const audioStatus =
  document.getElementById("audioStatus");

const testSoundBtn =
  document.getElementById("testSoundBtn");


/* =====================================
   LOAD REMINDERS
===================================== */

let reminders = [];

try {

  reminders = JSON.parse(
    localStorage.getItem("dailyReminders") || "[]"
  );

  if (!Array.isArray(reminders)) {
    reminders = [];
  }

}
catch (error) {

  reminders = [];

}


/* =====================================
   SAVE REMINDERS
===================================== */

function saveReminders() {

  localStorage.setItem(
    "dailyReminders",
    JSON.stringify(reminders)
  );

}


/* =====================================
   TOAST MESSAGE
===================================== */

let toastTimer = null;

function showToast(message) {

  toast.textContent = message;

  toast.style.display = "block";

  if (toastTimer) {
    clearTimeout(toastTimer);
  }

  toastTimer = setTimeout(() => {

    toast.style.display = "none";

  }, 4000);

}


/* =====================================
   TODAY'S DATE
===================================== */

function updateDate() {

  const now = new Date();

  document.getElementById("today").textContent =
    now.toLocaleDateString(
      "en-US",
      {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );

}


/* =====================================
   FORMAT TIME
===================================== */

function formatTime(time) {

  const parts = time.split(":");

  const hours =
    Number(parts[0]);

  const minutes =
    Number(parts[1]);

  const date =
    new Date();

  date.setHours(
    hours,
    minutes,
    0,
    0
  );

  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


/* =====================================
   DISPLAY REMINDERS
===================================== */

function renderReminders() {

  list.innerHTML = "";

  if (reminders.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "No reminders yet. Add your first one!";

    list.appendChild(empty);

    return;

  }


  reminders.sort(
    (a, b) =>
      a.time.localeCompare(b.time)
  );
